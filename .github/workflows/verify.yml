name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go tests
        run: go test -race ./...
      - name: Build test executable
        run: go build -trimpath -o bridge-test.exe .
      - name: Connection recovery
        run: python scripts/connection_integration.py ./bridge-test.exe
      - name: Team and MCP recovery
        if: runner.os != 'Windows'
        run: python scripts/team_integration.py ./bridge-test.exe
      - name: Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path update.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Windows updater recovery fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/update_test.ps1
      - name: Check JavaScript
        run: |
          node --check web/app.js
          node --check web/team.js
          node --check web/help.js
